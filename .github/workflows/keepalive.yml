# Free Supabase projects pause after 7 days without activity.
# This job calls the site once a day; /api/health?deep=1 runs a small database query.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables → New:
#   NOUR_URL = https://your-project.vercel.app   (no trailing slash)
name: keep-alive

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site (also wakes / keeps Supabase active)
        run: |
          test -n "${{ vars.NOUR_URL }}" || { echo "Set the NOUR_URL repository variable"; exit 1; }
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.NOUR_URL }}/api/health?deep=1"
